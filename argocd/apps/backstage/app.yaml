name: backstage
repoURL: https://backstage.github.io/charts
targetRevision: 2.10.2
sourcePath: ""
chartName: backstage
namespace: backstage
helmValues:
  backstage:
    replicas: 1
    image:
      registry: ""
      repository: k8s-lab/backstage
      tag: 0.1.6
      pullPolicy: Never
    args:
      - --config
      - app-config.yaml
    extraEnvVarsSecrets:
      - backstage-argocd
      - backstage-github-auth
    # Only one pod at a time, so plugin DB migrations never run concurrently.
    strategy:
      type: Recreate
  # Bundled PostgreSQL (Bitnami subchart) on an 8Gi PVC. Credentials come from
  # the backstage-postgresql-auth Secret in secrets.local.yaml: Argo CD renders
  # with `helm template`, so a chart-generated password would change on every
  # sync and lock Backstage out of the existing data volume.
  postgresql:
    enabled: true
    auth:
      existingSecret: backstage-postgresql-auth
