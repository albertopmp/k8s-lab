apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backstage
  description: Local Backstage developer portal installed from the official Helm chart.
  annotations:
    argocd/app-selector: k8s-lab/instance-of=backstage
    github.com/project-slug: albertopmp/k8s-lab
    # Kargo Project holding this app's Warehouse (named after the app directory).
    kargo/project: k8s-lab
  tags:
    - kubernetes
    - helm
    - argocd
    - backstage
spec:
  type: website
  lifecycle: experimental
  owner: guests
