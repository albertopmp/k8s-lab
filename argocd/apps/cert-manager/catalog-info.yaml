apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: cert-manager
  description: cert-manager issues certificates in the local Kubernetes lab (Kargo webhook certificate).
  annotations:
    backstage.io/source-location: url:https://github.com/albertopmp/k8s-lab/blob/master/argocd/apps/cert-manager/catalog-info.yaml
    argocd/app-selector: k8s-lab/instance-of=cert-manager
    github.com/project-slug: albertopmp/k8s-lab
    # Kargo Project holding this app's Warehouse (named after the app directory).
    kargo/project: k8s-lab
  tags:
    - kubernetes
    - helm
    - argocd
    - cert-manager
spec:
  type: service
  lifecycle: experimental
  owner: guests
