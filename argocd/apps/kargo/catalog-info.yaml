apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kargo
  description: Kargo promotion engine deployed by Argo CD in the local Kubernetes lab.
  annotations:
    argocd/app-selector: k8s-lab/instance-of=kargo
    github.com/project-slug: albertopmp/k8s-lab
    # Kargo Project holding this app's Warehouse (named after the app directory).
    kargo/project: k8s-lab
  tags:
    - kubernetes
    - helm
    - argocd
    - kargo
spec:
  type: service
  lifecycle: experimental
  owner: guests
