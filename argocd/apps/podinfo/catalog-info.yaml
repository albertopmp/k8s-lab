apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: podinfo
  description: Podinfo sample service deployed by Argo CD in the local Kubernetes lab.
  annotations:
    backstage.io/source-location: url:https://github.com/albertopmp/k8s-lab/blob/master/argocd/apps/podinfo/catalog-info.yaml
    argocd/app-selector: k8s-lab/instance-of=podinfo
    github.com/project-slug: albertopmp/k8s-lab
    # Kargo Project holding this app's Warehouse (named after the app directory).
    kargo/project: k8s-lab
  tags:
    - kubernetes
    - helm
    - argocd
    - sample
spec:
  type: service
  lifecycle: experimental
  owner: guests
