apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: local-lab-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/albertopmp/k8s-lab.git
        revision: master
        # Each argocd/apps/<app>/<env>.yaml (dev, stg, prd) is one Application;
        # all instances of an app share the folder's catalog-info.yaml.
        files:
          - path: argocd/apps/*/*.yaml
          - path: argocd/apps/*/catalog-info.yaml
            exclude: true
  template:
    metadata:
      name: '{{ .name }}'
      # Default labels on every Application, derived from the file's location
      # (argocd/apps/<app>/<env>.yaml). Backstage finds all instances of an app
      # with `argocd/app-selector: k8s-lab/instance-of=<app>`.
      labels:
        k8s-lab/instance-of: '{{ .path.basename }}'
        k8s-lab/environment: '{{ trimSuffix ".yaml" .path.filename }}'
    spec:
      project: default
      source:
        repoURL: '{{ .repoURL }}'
        targetRevision: '{{ .targetRevision }}'
        path: '{{ .sourcePath }}'
        chart: '{{ .chartName }}'
        helm:
          values: |
            {{- .helmValues | toYaml | nindent 12 }}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          prune: true
          selfHeal: true
