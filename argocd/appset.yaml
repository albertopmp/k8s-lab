apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: local-lab-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/albertopmp/k8s-lab.git
        revision: master
        # Each argocd/apps/<app>/<env>.yaml (dev, stg, prd) is one Application;
        # all instances of an app share the folder's catalog-info.yaml.
        files:
          - path: argocd/apps/*/*.yaml
          - path: argocd/apps/*/catalog-info.yaml
            exclude: true
  # Everything identifying an instance comes from its path,
  # argocd/apps/<app>/<env>.yaml:
  #   Application name  <app>-<env>      e.g. guestbook-stg
  #   namespace         apps-<env>       e.g. apps-stg (shared by all apps of an env)
  #   labels            instance-of=<app>, environment=<env>
  # Backstage finds all instances of an app with
  # `argocd/app-selector: k8s-lab/instance-of=<app>`.
  template:
    metadata:
      name: '{{ .path.basename }}-{{ trimSuffix ".yaml" .path.filename }}'
      labels:
        k8s-lab/instance-of: '{{ .path.basename }}'
        k8s-lab/environment: '{{ trimSuffix ".yaml" .path.filename }}'
    spec:
      project: default
      source:
        repoURL: '{{ .repoURL }}'
        targetRevision: '{{ .targetRevision }}'
        path: '{{ .sourcePath }}'
        chart: '{{ .chartName }}'
        helm:
          values: |
            {{- .helmValues | toYaml | nindent 12 }}
      destination:
        server: https://kubernetes.default.svc
        namespace: 'apps-{{ trimSuffix ".yaml" .path.filename }}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          prune: true
          selfHeal: true
