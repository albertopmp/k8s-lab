apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: local-lab-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/albertopmp/k8s-lab.git
        revision: master
        files:
          - path: argocd/apps/*/app.yaml
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      project: default
      source:
        repoURL: '{{ .repoURL }}'
        targetRevision: '{{ .targetRevision }}'
        path: '{{ .sourcePath }}'
        chart: '{{ .chartName }}'
        helm:
          values: |
            {{- .helmValues | toYaml | nindent 12 }}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          prune: true
          selfHeal: true
