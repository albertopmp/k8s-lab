app:
  title: K8s Lab Backstage
  baseUrl: http://localhost:7007

  # Enable all packages by default, this will discover packages from packages/app/package.json
  packages: all

  extensions:
    # Landing page: Home at /, the catalog at its default /catalog.
    - page:home:
        config:
          path: /
          # 12-column grid. Row 1: search. Row 2: quick actions, starred,
          # notifications. Row 3: lab links and visit history.
          defaultConfig:
            - component: HomePageSearchBar
              column: 0
              row: 0
              width: 12
              height: 2
              deletable: false
            - component: HomePageFeaturedTemplates
              column: 0
              row: 2
              width: 5
              height: 6
            - component: UnreadNotifications
              column: 5
              row: 2
              width: 5
              height: 6
              deletable: false
            - component: HomePageRecentlyVisited
              column: 0
              row: 8
              width: 4
              height: 6
            - component: HomePageStarredEntities
              column: 4
              row: 8
              width: 3
              height: 6
            - component: HomePageToolkit
              column: 7
              row: 8
              width: 3
              height: 6
              deletable: false

    # Quick actions: templates tagged `kargo` (the Kargo promotion template).
    - home-page-widget:scaffolder/featured-templates:
        config:
          title: Quick actions
          tag: kargo

    # Lab links.
    - home-page-widget:home/toolkit:
        config:
          tools:
            - url: http://localhost:8080
              label: Argo CD
              icon: dashboard
            - url: http://localhost:8081
              label: Kargo
              icon: dashboard
            - url: https://github.com/albertopmp/k8s-lab
              label: k8s-lab repo
              icon: github
            - url: https://backstage.io/docs
              label: Backstage docs
              icon: docs
            - url: https://docs.kargo.io
              label: Kargo docs
              icon: docs

    # Visit tracking feeds Recently Visited and Most Visited (stored per user
    # through user settings, or browser localStorage).
    - api:home/visits: true
    - app-root-element:home/visit-listener: true

    # Not used on this Home.
    - home-page-widget:home/random-joke: false
    - home-page-widget:home/world-clock: false

    # Standalone graph (/catalog-graph) starts from the lab System, so it shows
    # all lab apps and their resources instead of an empty canvas.
    - page:catalog-graph:
        config:
          rootEntityRefs:
            - system:default/k8s-lab

    - page:catalog/entity:
        config:
          groups:
            - overview:
                title: Overview
            - documentation:
                title: Documentation
            - deployment:
                title: ArgoCD
          defaultContentOrder: natural

    # Tab order follows the order of these entity-content entries:
    # Overview > Documentation > ArgoCD > GitHub Actions

    # Overview
    - entity-content:catalog/overview:
        config:
          group: overview

    # Documentation
    - entity-content:techdocs:
        config:
          group: documentation

    # ArgoCD (both contents already default to the "deployment" group)
    - entity-content:backstage-community-argocd/deployment-lifecycle
    - entity-content:backstage-community-argocd/deployment-summary

    # GitHub Actions (standalone tab, last)
    - entity-content:github-actions

    # Hide the APIs tab on Component pages
    - entity-content:api-docs/apis: false

    # Overview cards
    # Every `entity-card:*` extension attaches to the Overview tab
    # (entity-content:catalog/overview) by default; that is built into
    # EntityCardBlueprint, so no tab needs to be named here. Each card takes:
    #   type:   info    -> right column
    #           content -> main column (also the default when unset)
    #   filter: which entities show the card, as an entity predicate
    # Within a column, cards render in the order they are listed below.
    - entity-card:catalog-graph/relations:
        config:
          type: content

    # Mitek custom: "Promote with Kargo" button (plugins/mitek-kargo) that opens
    # the Kargo promotion template with the component preselected. Right
    # column, above the GitHub Actions card, on components managed by Kargo.
    - entity-card:mitek-kargo/promote:
        config:
          type: info
          filter:
            kind: component
            metadata.annotations.kargo/project:
              $exists: true

    - entity-card:github-actions/recent-workflow-runs: false
    - entity-card:github-actions/latest-workflow-run:
        config:
          type: info

organization:
  name: My Company

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:7007
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # Local lab only: this allows unauthenticated API calls. Do not use in production.
  auth:
    dangerouslyDisableDefaultAuthPolicy: true
  # PostgreSQL from the Helm chart's bundled subchart, stored on a PVC so
  # registered entities survive pod restarts. The chart injects these env vars.
  # For `yarn start` without Postgres, override this in app-config.local.yaml
  # with `client: better-sqlite3` and `connection: ':memory:'`.
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
  # see https://backstage.io/docs/ai/mcp-actions#actions-configuration for more details
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

argocd:
  appLocatorMethods:
    - type: config
      instances:
        - name: local
          url: http://argocd-server.argocd.svc.cluster.local
          username: ${ARGOCD_USERNAME}
          password: ${ARGOCD_PASSWORD}

# Mitek custom: Kargo API for plugins/mitek-kargo-backend (routes and the
# mitek:kargo:promote scaffolder action). The token is the k8s-lab
# Project's kargo-promoter API token, copied by `make secrets` into the
# backstage-kargo Secret. uiUrl builds links to the Kargo UI (`make ui`).
mitek:
  kargo:
    baseUrl: http://kargo-api.apps-prd.svc.cluster.local
    token: ${KARGO_API_TOKEN}
    uiUrl: http://localhost:8081

proxy:
  ### Example for how to add a proxy endpoint for the frontend.
  ### A typical reason to do this is to handle HTTPS and CORS for internal services.
  # endpoints:
  #   '/test':
  #     target: 'https://example.com'
  #     changeOrigin: true

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker' # Alternatives - 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  providers:
    # See https://backstage.io/docs/auth/guest/provider
    guest:
      dangerouslyAllowOutsideDevelopment: true
      # Sign in as the catalog user in examples/org.yaml (member of `guests`,
      # which owns the lab apps), so ownership and notifications reach you.
      # The default, user:development/guest, exists in no catalog file.
      userEntityRef: user:default/guest
    # GitHub Actions uses this provider to get a user-scoped GitHub token.
    # Create a GitHub OAuth App with callback
    # http://localhost:7007/api/auth/github/handler/frame, then set these values
    # in the Backstage runtime environment.
    github:
      development:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
  # see https://backstage.io/docs/ai/mcp-actions#client-id-metadata-documents
  # to learn more about client id metadata documents
  clientIdMetadataDocuments:
    enabled: false
    # Optional: restrict which `client_id` URLs are allowed (defaults to ['*'])
    # allowedClientIdPatterns:
    #   - 'https://example.com/*'
    #   - 'https://*.trusted-domain.com/*'
    # Optional: restrict which redirect URIs are allowed (defaults to ['*'])
    # allowedRedirectUriPatterns:
    #   - 'http://localhost:*'
    #   - 'https://*.example.com/*'

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    # Users and groups (baked into the image): `guests` owns every lab app and
    # receives its notifications; `guest` is who the guest sign-in becomes.
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]

    # Lab apps, read from GitHub: argocd/catalog-info.yaml (the k8s-lab
    # System) and every argocd/apps/<app>/catalog-info.yaml (glob), so a new
    # app folder is registered without listing it anywhere.
    - type: url
      target: https://github.com/albertopmp/k8s-lab/blob/master/argocd/**/catalog-info.yaml

    # Mitek custom templates, read from GitHub (not baked into the image).
    # New or edited templates appear after a push and the next catalog
    # refresh (a few minutes), or instantly with "Refresh" on the Location.
    - type: url
      target: https://github.com/albertopmp/k8s-lab/blob/master/backstage/templates/mitek/locations.yaml
      rules:
        - allow: [Location, Template]

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true

# see https://backstage.io/docs/ai/mcp-actions for more details
mcpActions:
  name: 'My Company Backstage' # defaults to "backstage"
  description: 'Tools for managing your software catalog, creating new services from templates, and exploring your developer portal' # optional
