apiVersion: scaffolder.backstage.io/v1beta3
# Mitek custom template: renders a Kubernetes Deployment manifest on screen.
kind: Template
metadata:
  name: mitek-k8s-deployment
  title: Kubernetes Deployment
  description: Generate a Kubernetes Deployment manifest for a catalog Component and one of its Kargo Freight, with a pinned image digest and environment variables.
  tags:
    - mitek
    - kubernetes
spec:
  owner: user:guest
  type: kubernetes

  parameters:
    - title: Source
      required:
        - component
        - freight
      properties:
        component:
          title: Component
          type: string
          description: Catalog Component to deploy.
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Component
              metadata.annotations.kargo/project:
                exists: true
        freight:
          title: Freight
          type: string
          description: Kargo Freight of the component (its app Warehouse), newest first.
          ui:field: MitekFreightPicker
          ui:options:
            entityField: component

    - title: Deployment
      required:
        - name
        - namespace
      properties:
        name:
          title: Name
          type: string
          description: Deployment name (lowercase letters, digits and hyphens).
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
          ui:autofocus: true
        namespace:
          title: Namespace
          type: string
          default: default
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63

    - title: Container image
      required:
        - imageRepository
        - imageDigest
      properties:
        imageRepository:
          title: Image name
          type: string
          description: Registry and repository, e.g. ghcr.io/mitek/api
          pattern: '^[a-z0-9]+([._:/-][a-z0-9]+)*$'
        imageTag:
          title: Tag
          type: string
          description: Optional and informational; the digest is what Kubernetes pulls.
          pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
        imageDigest:
          title: Digest
          type: string
          description: Immutable image digest, e.g. sha256:3f5c... (64 hex characters). Kubernetes pulls by digest.
          pattern: '^sha256:[a-f0-9]{64}$'

    - title: Environment variables
      properties:
        env:
          title: Variables
          type: array
          default: []
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                title: Key
                type: string
                description: UPPER_SNAKE_CASE, e.g. LOG_LEVEL
                pattern: '^[A-Z_][A-Z0-9_]*$'
              value:
                title: Value
                type: string

  steps:
    - id: log
      name: Render manifest
      action: debug:log
      input:
        message: Rendering Deployment ${{ parameters.namespace }}/${{ parameters.name }}

  output:
    text:
      - title: deployment.yaml
        content: |
          ```yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ parameters.namespace }}
            labels:
              app.kubernetes.io/name: ${{ parameters.name }}
            annotations:
              backstage.io/source-entity: ${{ parameters.component }}
              kargo.akuity.io/freight: ${{ parameters.freight }}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: ${{ parameters.name }}
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: ${{ parameters.name }}
              spec:
                containers:
                  - name: ${{ parameters.name }}
                    image: ${{ parameters.imageRepository }}{% if parameters.imageTag %}:${{ parameters.imageTag }}{% endif %}@${{ parameters.imageDigest }}
          {%- if parameters.env and parameters.env.length %}
                    env:
          {%- for e in parameters.env %}
                      - name: ${{ e.name }}
                        value: ${{ e.value | dump }}
          {%- endfor %}
          {%- endif %}
          ```
