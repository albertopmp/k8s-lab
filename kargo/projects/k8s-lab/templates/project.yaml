# The namespace is declared (and labelled for Kargo to adopt) so the
# credentials Secret from `make secrets` can exist before the Project.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.project }}
  labels:
    kargo.akuity.io/project: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: {{ .Values.project }}
---
# Auto-promotion is set per Stage at the Project level: on for the Stages in
# .Values.autoPromotionStages, off for the rest.
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: {{ .Values.project }}
  namespace: {{ .Values.project }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  promotionPolicies:
  {{- range .Values.stages }}
    - stageSelector:
        name: {{ . }}
      autoPromotionEnabled: {{ has . $.Values.autoPromotionStages }}
  {{- end }}
