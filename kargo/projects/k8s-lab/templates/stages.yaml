{{- /*
One Stage per entry in .Values.stages, each requesting Freight from every app
Warehouse (auto-promotion runs independently per app). The first Stage takes
Freight straight from the Warehouses; each later one from the Stage before it. Promotion is a smoke
step: `compose-output` only builds an output value, touching nothing.
*/ -}}
{{- $prev := "" }}
{{- range .Values.stages }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: {{ . }}
  namespace: {{ $.Values.project }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  requestedFreight:
  {{- range $.Values.apps }}
    - origin:
        kind: Warehouse
        name: {{ . }}
      sources:
        {{- if $prev }}
        stages:
          - {{ $prev }}
        {{- else }}
        direct: true
        {{- end }}
  {{- end }}
  promotionTemplate:
    spec:
      steps:
        - uses: compose-output
          as: smoke
          config:
            message: smoke promotion to {{ . }}
{{- $prev = . }}
{{- end }}
