{{- /*
One Warehouse per app directory. It creates Freight automatically for every
new commit on the branch that changes argocd/apps/<app>/. The repository is
private: credentials come from the `k8s-lab-git` Secret (label
kargo.akuity.io/cred-type: git) created by `make secrets`.
*/ -}}
{{- range .Values.apps }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: {{ . }}
  namespace: {{ $.Values.project }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  freightCreationPolicy: Automatic
  subscriptions:
    - git:
        repoURL: {{ $.Values.repoURL }}
        branch: {{ $.Values.branch }}
        commitSelectionStrategy: NewestFromBranch
        discoveryLimit: 20
        includePaths:
          - argocd/apps/{{ . }}
{{- end }}
