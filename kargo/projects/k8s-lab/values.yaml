# Kargo Project (and its namespace).
project: k8s-lab
# Git repository the Warehouses subscribe to.
repoURL: https://github.com/albertopmp/k8s-lab.git
branch: master
# One Warehouse per app directory, named after it: a new commit touching
# argocd/apps/<app>/ becomes Freight for that app. Keep in sync with the
# folders in argocd/apps/ (each has a catalog-info.yaml whose
# `kargo/project` annotation points at this Project).
apps:
  - backstage
  - cert-manager
  - guestbook
  - kargo
  - kargo-k8s-lab
  - podinfo
# Promotion order; each Stage after the first takes Freight from the previous
# one. Every Stage receives Freight from every app's Warehouse.
stages:
  - dev
  - stg
  - prd
# Stages that promote new Freight automatically. The others only change
# through a manual promotion (Backstage's Kargo promote template or the Kargo
# UI), so a manual promotion of older Freight isn't replaced again.
autoPromotionStages:
  - dev
